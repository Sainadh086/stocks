[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", ".tools", "india_stocks", "us_stocks", "backtests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "brokers", "shared", "trading"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
